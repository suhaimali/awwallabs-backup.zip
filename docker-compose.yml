# Adapted for the awwallabs.in server (2026-09-11).
# Differences from the repo default, and why:
#   - no bundled MySQL: reuses the LIVE MariaDB (awaal-db-1) holding 31 tables
#   - joins the existing awaal_awaal-network so DB_HOST=db resolves
#   - publishes 8080 because NPM forwards awwallabs.in -> 172.17.0.1:8080
#   - env_file only; no inline environment block with wrong creds/domain
# Original upstream file kept as docker-compose.yml.orig
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: awwallabs-app:latest
    container_name: awwallabs-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:80"
    volumes:
      - awwallabs_storage:/app/storage
    networks:
      - awaal-network

networks:
  awaal-network:
    external: true
    name: awaal_awaal-network

volumes:
  awwallabs_storage:
